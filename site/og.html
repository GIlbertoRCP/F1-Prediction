<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Automata F1 preview card</title>
<!-- The link-preview picture (og.png). The update workflow screenshots this page at 1200×630 after each data
     refresh, so a shared link shows the forecast that is on the site right now. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Barlow:wght@500;600&display=block" rel="stylesheet">
<style>html, body { margin: 0; background: #0a0b0e; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<canvas width="1200" height="630"></canvas>
<script type="module">
  import { forecastCard, brandCard, paintCard } from "./share.js";
  const get = (p) => fetch(p).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  const host = "gilbertorcp.github.io/F1-Prediction";
  const [forecast, circuits] = await Promise.all([get("data/forecast.json"), get("data/circuits.json")]);
  await paintCard((forecast && forecastCard(forecast, circuits, host)) || brandCard(host), document.querySelector("canvas"));
  document.title = "ready";
</script>
</body>
</html>
