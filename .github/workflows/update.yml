# Keeps the Oracle current without anyone running commands:
#   fetch results -> freeze the forecast once qualifying is done -> rebuild site/data -> commit -> deploy.
# Runs every three hours from Friday to Monday (UTC), which covers every qualifying session,
# so a forecast is frozen within three hours of the grid being set. It never edits an existing
# forecast (see oracle/store.py) and refuses to log one after the race has started.
name: update-oracle

on:
  schedule:
    - cron: "17 */3 * * 5,6,0,1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update-oracle
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          python -m unittest discover -s tests
          node --test tests/*.test.mjs
      - name: Fetch the current season
        if: github.event_name != 'push'
        run: python scripts/fetch_results.py --from "$(date -u +%Y)"
      - name: Fallback grid from F1 timing data (only acts if the results API is late)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          pip install "fastf1>=3.8.3"
          python scripts/fetch_fastf1_grid.py
      - name: Freeze forecast and rebuild site data
        run: python -m oracle.publish
      - name: Commit changes
        id: commit
        if: github.event_name != 'push'
        run: |
          git config user.name "oracle-bot"
          git config user.email "oracle-bot@users.noreply.github.com"
          git add data/results data/predictions site/data
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "Update results and forecasts $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Load the built page in a real browser before anything is deployed; a page that throws never ships.
      - name: Smoke-test the page
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        run: python scripts/smoke_test.py
      # A scheduled run that found nothing new has nothing to deploy; pushes and manual runs always deploy.
      - name: Draw the link-preview picture
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        continue-on-error: true          # the committed og.png stays in place if this fails
        run: |
          python -m http.server 8000 -d site >/dev/null 2>&1 &
          sleep 1
          google-chrome --headless=new --disable-gpu --hide-scrollbars --window-size=1200,630 \
            --virtual-time-budget=10000 --screenshot=site/og.png http://localhost:8000/og.html
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'

      # A failed weekend run means a forecast that never appears, so say so loudly: one open issue,
      # commented on by each further failure and closed by the next run that works.
      - name: Report a failed run
        if: failure() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --state open --label pipeline-failure --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $RUN_URL"
          else
            gh label create pipeline-failure --color d93f0b --description "The scheduled update failed" 2>/dev/null || true
            gh issue create --label pipeline-failure --title "Scheduled update failed" \
              --body "The update run failed, so results or the next forecast may be missing from the site. Run: $RUN_URL"
          fi
      - name: Close the failure issue once a run works again
        if: success() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --state open --label pipeline-failure --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Fixed: this run worked. $RUN_URL"
          done
