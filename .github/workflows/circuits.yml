# One-time (and re-runnable) job that draws every circuit from real car positions, so nobody has to run
# scripts/extract_circuits.py by hand. Start it from the Actions tab ("Run workflow"). It is resumable:
# circuits already in site/data/circuits.json are skipped, and it waits out FastF1's hourly API limit.
# When it finishes it commits site/data/circuits.json and starts the normal update job to redeploy the site.
name: draw-circuits

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: draw-circuits
  cancel-in-progress: false

jobs:
  circuits:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FastF1
        run: pip install "fastf1>=3.8.3"
      - name: Draw circuits
        run: python scripts/extract_circuits.py
      - name: Commit outlines
        run: |
          git config user.name "oracle-bot"
          git config user.email "oracle-bot@users.noreply.github.com"
          git add site/data/circuits.json
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "Draw circuit outlines from real car positions"
            git push
          fi
      - name: Redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-oracle
